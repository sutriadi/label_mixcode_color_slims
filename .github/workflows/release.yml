name: Release

# Dijalankan manual: Actions > Release > Run workflow.
# Membuat tag + GitHub Release dari branch yang dipilih, lengkap dengan paket zip plugin.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis, mis. 1.1.0 (harus sama dengan "Version" di label_mixcode_color_slims.plugin.php)'
        required: true
        type: string
      prerelease:
        description: 'Tandai sebagai pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validasi tag dan versi plugin
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Format tag tidak valid: '$TAG' (contoh: 1.1.0)"; exit 1
          fi
          PLUGIN_VERSION=$(sed -n 's/^ \* Version: *//p' label_mixcode_color_slims.plugin.php | head -1 | tr -d '\r')
          if [ "$PLUGIN_VERSION" != "$TAG" ]; then
            echo "::error::Tag '$TAG' tidak sama dengan Version plugin '$PLUGIN_VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' sudah ada"; exit 1
          fi

      - name: Cek sintaks PHP
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.php'); do php -l "$f" >/dev/null; done
          echo "Semua file PHP lolos php -l ($(php -r 'echo PHP_VERSION;'))"

      - name: Susun paket zip
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=label_mixcode_color_slims/ \
            -o "label_mixcode_color_slims-${TAG}.zip" HEAD -- . ':(exclude).github'
          unzip -l "label_mixcode_color_slims-${TAG}.zip" | tail -1

      - name: Buat tag dan Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "$TAG")
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then args+=(--notes-file "$NOTES"); else args+=(--generate-notes); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "label_mixcode_color_slims-${TAG}.zip" "${args[@]}"
          echo "### Rilis $TAG dibuat" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
